name: Docs site

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

# Only one deployment at a time, and let a run in progress finish rather than
# cancelling it half way through a publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The pages, not the working papers: the plans and the tool that
      # regenerates the navigation live in docs/ too, and uploading the
      # directory as it stands published them.
      - name: Gather the site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude '*.md' --exclude 'tools/' docs/ "$RUNNER_TEMP/site/"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - id: deployment
        uses: actions/deploy-pages@v4
