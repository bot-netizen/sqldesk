name: Docs site

# The site follows whichever branch last published it: a release branch
# while its release candidates are out, main once the release is made. A
# post committed to blog/ on either goes live with that push.
on:
  push:
    branches: [main, "release/**"]
    paths: ["docs/**", "blog/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

# Only one deployment at a time, and let a run in progress finish rather than
# cancelling it half way through a publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Posts are Markdown in blog/. This turns them into docs/blog/, and
      # fails the deploy -- naming the file -- if any of them cannot be built.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build the blog
        run: |
          python -m pip install markdown-it-py==4.2.0 pyyaml==6.0.3
          python docs/tools/blog.py

      # The index the search box reads: every section of the guide, every
      # release and every post. After the blog, so the posts are in it.
      - name: Build the search index
        run: python docs/tools/search.py

      # The pages, not the working papers: the plans and the tool that
      # regenerates the navigation live in docs/ too, and uploading the
      # directory as it stands published them.
      - name: Gather the site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude '*.md' --exclude 'tools/' docs/ "$RUNNER_TEMP/site/"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - id: deployment
        uses: actions/deploy-pages@v4
