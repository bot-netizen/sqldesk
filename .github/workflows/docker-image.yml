name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # A tag publishes to a registry people pull from, and this workflow's tag
  # trigger is independent of the Tests workflow -- so until now `git tag v…`
  # published whatever was at that commit, green or red. This asks whether the
  # Tests run for this exact commit succeeded, and stops the build if it did
  # not.
  #
  # Only for tags: a push to main is already gated by the tests on the pull
  # request, and a manual run is somebody deciding.
  tested:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Did the tests pass on this commit?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          conclusion=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "none"')
          echo "Tests run for $SHA: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Refusing to publish $SHA: its Tests run is '$conclusion', not 'success'."
            echo "Run the Tests workflow on this commit, or re-run the failed one, before tagging."
            exit 1
          fi

  # Each platform is built on a machine of its own architecture. Building arm64
  # on an amd64 runner meant emulating it, and under emulation installing the
  # Python dependencies took 22 minutes against 3, and the frontend 30 against
  # 4 -- a 35-minute build that is now about ten.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # `always()` so a push to main or a manual run -- where `tested` is skipped
    # -- still builds; a skipped job is not a failed one, but without this the
    # dependency would make the whole build skip with it.
    needs: tested
    if: always() && (needs.tested.result == 'success' || needs.tested.result == 'skipped')
    permissions:
      contents: read
      # Needed to push to the GitHub Container Registry with the built-in token,
      # so publishing works without any secrets being configured.
      packages: write

    steps:
      - name: Name the platform
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Pushed by digest only; the merge job below gives the two images their
      # tags together, as one multi-platform image.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # `all_ds` installs the optional data-source SDKs; without it most
          # query runners are simply unavailable in the published image.
          build-args: install_groups=main,all_ds
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

      # The image, run, before anybody can pull it.
      #
      # Everything above this proves the image *builds*. What breaks a release
      # is an image that builds and then cannot start: a shared library left
      # in the builder stage of a multi-stage Dockerfile, a console script
      # that did not come across, a data source whose driver is quietly
      # missing. None of that fails a build, and all of it fails a user. The
      # layers are already in the cache, so loading the image for this costs
      # seconds.
      - name: Load the image onto this runner
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: install_groups=main,all_ds
          load: true
          tags: sqldesk:smoke
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}

      - name: Does it start, and are the data sources all there?
        env:
          SQLDESK_COOKIE_SECRET: smoke-test-only
          SQLDESK_SECRET_KEY: smoke-test-only
        run: |
          set -euo pipefail
          run() {
            docker run --rm \
              -e SQLDESK_COOKIE_SECRET -e SQLDESK_SECRET_KEY \
              --entrypoint /app/bin/docker-entrypoint sqldesk:smoke "$@"
          }

          echo "::group::Query runners"
          run manage ds list_types | tee types.txt
          echo "::endgroup::"
          count=$(grep -cE '^[a-z0-9_]+' types.txt)
          echo "$count query runner types"
          # Fewer than this means a driver did not make it into the image. The
          # exact number differs by platform -- the ODBC drivers are amd64
          # only -- so this is a floor, not an equality.
          [ "$count" -ge 70 ] || { echo "::error::only $count runner types; a driver is missing"; exit 1; }

          echo "::group::Every runner module imports"
          docker run --rm -e SQLDESK_COOKIE_SECRET -e SQLDESK_SECRET_KEY \
            --entrypoint python sqldesk:smoke -c '
          import importlib, pkgutil, sys, sqldesk.query_runner as qr
          broken = []
          for module in pkgutil.iter_modules(qr.__path__):
              try:
                  importlib.import_module("sqldesk.query_runner." + module.name)
              except Exception as error:
                  broken.append((module.name, type(error).__name__, str(error)[:120]))
          for name, kind, message in broken:
              print("BROKEN", name, kind, message)
          sys.exit(1 if broken else 0)'
          echo "::endgroup::"

          echo "::group::The server answers"
          docker run -d --name smoke -p 5000:5000 \
            -e SQLDESK_COOKIE_SECRET -e SQLDESK_SECRET_KEY sqldesk:smoke server
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5000/ping >/dev/null 2>&1; then
              echo "/ping answered after ${attempt}s"
              docker logs smoke 2>&1 | tail -5
              docker rm -f smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::the server did not answer /ping within 30s"
          docker logs smoke 2>&1 | tail -40
          docker rm -f smoke >/dev/null
          exit 1
          echo "::endgroup::"

      - name: Keep the digest for the merge
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is left to the action's default, which puts it on the
          # highest released version. Adding it for the default branch as well
          # would make it flip between the newest release and whatever landed on
          # main an hour ago, which is not what anyone pulling `latest` wants.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Tag the two platforms as one image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Check both platforms are in it
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "$image"
          for platform in linux/amd64 linux/arm64; do
            docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | grep -q "\"${platform#linux/}\"" \
              || { echo "missing $platform"; exit 1; }
          done

      # Docker Hub, when it is configured. Absent secrets are not a failure:
      # ghcr.io is published either way and always has been, so turning Docker
      # Hub on is two secrets rather than a change to this file -- and a fork
      # that has neither still builds.
      - name: Is Docker Hub configured?
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub secrets are not set; published to ${{ env.REGISTRY }} only."
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The manifest ghcr.io already has, copied across by digest rather than
      # built a second time -- so the two registries cannot serve images that
      # disagree, and this costs one API call instead of another ten minutes.
      #
      # The namespace comes from the DOCKERHUB_IMAGE repository variable, and
      # falls back to <username>/sqldesk, which is what a personal account
      # will want.
      - name: Mirror the image to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          : "${DOCKERHUB_IMAGE:=${DOCKERHUB_USERNAME}/sqldesk}"
          echo "DOCKERHUB_IMAGE=$DOCKERHUB_IMAGE" >> "$GITHUB_ENV"
          args=""
          for tag in $(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            args="$args -t ${DOCKERHUB_IMAGE}:${tag##*:}"
          done
          echo "Mirroring to:$args"
          docker buildx imagetools create $args \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

      - name: Check Docker Hub has both platforms too
        if: steps.dockerhub.outputs.enabled == 'true'
        run: |
          image="${DOCKERHUB_IMAGE}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "$image"
          for platform in linux/amd64 linux/arm64; do
            docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | grep -q "\"${platform#linux/}\"" \
              || { echo "missing $platform"; exit 1; }
          done

  # The optional renderer for alert screenshots, as an image of its own so
  # nobody has to build it. Its own job because it shares nothing with the
  # main image: a different base, three pip packages, and a build that takes
  # a minute even under emulation -- so both platforms come from one runner.
  screenshots:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-screenshots
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.screenshots
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha,scope=screenshots
          cache-to: type=gha,scope=screenshots,mode=max
