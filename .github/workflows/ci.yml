name: Tests
on:
  push:
    branches:
      - main
      # Release candidates are cut from release branches, so they get the full
      # suite on every push rather than only when a pull request is opened.
      - "release/**"
  pull_request:
    branches:
      - main
env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.30.3
jobs:
  backend-lint:
    runs-on: ubuntu-22.04
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install black==23.1.0 ruff==0.0.287
      - run: ruff check .
      - run: black --check .

  # The chart, rendered and linted. `helm template` catches what a YAML lint
  # cannot: a value referenced but never defined renders as empty and the
  # object is silently wrong, and a strategy or probe the API server will
  # refuse is only visible once it is rendered. Cheap, and it would have
  # caught a release-stopping upgrade failure in 0.7.7.
  chart:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - run: helm lint charts/sqldesk
      - name: Render it the ways people deploy it
        run: |
          set -euo pipefail
          helm template sqldesk charts/sqldesk > /dev/null
          helm template sqldesk charts/sqldesk -f examples/values-production.yaml > /dev/null
          helm template sqldesk charts/sqldesk \
            --set mcp.enabled=true --set streams.enabled=true --set uploads.enabled=true \
            --set server.replicas=2 --set periodicWorker.enabled=false > /dev/null
          # Notebooks with the policy on, which is the configuration whose
          # whole point is the policy: an interpreter with no egress.
          helm template sqldesk charts/sqldesk \
            --set notebooks.enabled=true --set networkPolicy.enabled=true > /dev/null
          # And with Spark, where "no egress" becomes one rule and the two
          # settings have to be written together.
          helm template sqldesk charts/sqldesk \
            --set notebooks.enabled=true --set networkPolicy.enabled=true \
            --set notebooks.spark.remote=sc://spark-connect:15002 \
            --set 'notebooks.spark.egress[0].ports[0].port=15002' > /dev/null
      - name: Does it parse as Kubernetes objects?
        run: |
          helm template sqldesk charts/sqldesk | python3 -c "
          import sys, yaml
          kinds = [d['kind'] for d in yaml.safe_load_all(sys.stdin) if d]
          print(len(kinds), 'objects:', ', '.join(sorted(set(kinds))))
          assert 'Deployment' in kinds and 'Service' in kinds, kinds"

  backend-unit-tests:
    runs-on: ubuntu-22.04
    needs: backend-lint
    env:
      COMPOSE_FILE: .ci/compose.ci.yaml
      COMPOSE_PROJECT_NAME: sqldesk
      COMPOSE_DOCKER_CLI_BUILD: 1
      DOCKER_BUILDKIT: 1
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build Docker Images
        run: |
          set -x
          docker compose build --build-arg install_groups="main,all_ds,dev" --build-arg skip_frontend_build=true
          docker compose up -d
          sleep 10
      - name: Create Test Database
        run: docker compose -p sqldesk run --rm postgres psql -h postgres -U postgres -c "create database tests;"
      - name: List Enabled Query Runners
        run: docker compose -p sqldesk run --rm sqldesk manage ds list_types
      - name: Run Tests
        run: docker compose -p sqldesk run --name tests sqldesk tests --junitxml=junit.xml --cov-report=xml --cov=sqldesk tests/
      - name: Copy Test Results
        run: |
          mkdir -p /tmp/test-results/unit-tests
          docker cp tests:/app/coverage.xml ./coverage.xml
          docker cp tests:/app/junit.xml /tmp/test-results/unit-tests/results.xml
      - name: Store Test Results
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: /tmp/test-results
      - name: Store Coverage Results
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  frontend-lint:
    runs-on: ubuntu-22.04
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Lint
        run: pnpm run lint:ci
      - name: Store Test Results
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: /tmp/test-results

  frontend-unit-tests:
    runs-on: ubuntu-22.04
    needs: frontend-lint
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      # Both packages' type-checks and both jest suites; see the `test` script.
      - name: Run Tests
        run: pnpm run test
      - run: pnpm run lint
      # What has to arrive before a dashboard draws. Fails when it grows past
      # client/bundle-budget.json, because a page gets slow a few kilobytes at
      # a time and nobody notices until it is a second and a half.
      - name: Check the initial load against its budget
        run: pnpm run bundle-budget

  frontend-e2e-tests:
    runs-on: ubuntu-22.04
    needs: frontend-lint
    env:
      COMPOSE_FILE: .ci/compose.cypress.yaml
      COMPOSE_PROJECT_NAME: cypress
      CYPRESS_INSTALL_BINARY: 0
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 1
      # PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
      # CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
      # CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
    steps:
      - if: github.event.pull_request.mergeable == 'false'
        name: Exit if PR is not mergeable
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Enable Code Coverage Report For Master Branch
        if: endsWith(github.ref, '/main')
        run: |
          echo "CODE_COVERAGE=true" >> "$GITHUB_ENV"
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup SQLDesk Server
        run: |
          set -x
          pnpm run cypress build
          pnpm run cypress start -- --skip-db-seed
          docker compose run cypress pnpm run cypress db-seed
      - name: Execute Cypress Tests
        run: pnpm run cypress run-ci
      - name: "Failure: output container logs to console"
        if: failure()
        run: docker compose logs
      - name: Copy Code Coverage Results
        run: docker cp cypress:/usr/src/app/coverage ./coverage || true
      - name: Store Coverage Results
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
