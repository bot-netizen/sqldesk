# This configuration file is for the **development** setup.
x-sqldesk-service: &sqldesk-service
  build:
    context: .
    args:
      skip_frontend_build: "true"  # set to empty string to build
  volumes:
    - .:/app
  env_file:
    - .env
  # Both networks: the ordinary one, and the interpreter's. A container on an
  # internal network cannot be reached from outside it, so sharing it is the
  # only way the server can call the executor at all.
  networks:
    - default
    - sqldesk-executor
x-sqldesk-environment: &sqldesk-environment
  SQLDESK_HOST: http://localhost:5001
  SQLDESK_LOG_LEVEL: "INFO"
  SQLDESK_REDIS_URL: "redis://redis:6379/0"
  SQLDESK_DATABASE_URL: "postgresql://postgres@postgres/postgres"
  SQLDESK_RATELIMIT_ENABLED: "false"
  SQLDESK_MAIL_DEFAULT_SENDER: "sqldesk@example.com"
  SQLDESK_MAIL_SERVER: "email"
  SQLDESK_MAIL_PORT: 1025
  SQLDESK_ENFORCE_CSRF: "true"
  SQLDESK_NOTEBOOK_EXECUTOR_URL: "http://executor:5000"
  SQLDESK_NOTEBOOK_EXECUTOR_TOKEN: "dev-executor-token"
  SQLDESK_GUNICORN_TIMEOUT: 60
  # Set secret keys in the .env file
services:
  server:
    <<: *sqldesk-service
    command: dev_server
    depends_on:
      - postgres
      - redis
    ports:
      - "5001:5000"
      - "5678:5678"
    environment:
      <<: *sqldesk-environment
      PYTHONUNBUFFERED: 0
  scheduler:
    <<: *sqldesk-service
    command: dev_scheduler
    depends_on:
      - server
    environment:
      <<: *sqldesk-environment
  worker:
    <<: *sqldesk-service
    command: dev_worker
    depends_on:
      - server
    environment:
      <<: *sqldesk-environment
      PYTHONUNBUFFERED: 0
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  postgres:
    image: postgres:18-alpine
    ports:
      - "15432:5432"
    # The following turns the DB into less durable, but gains significant performance improvements for the tests run (x3
    # improvement on my personal machine). We should consider moving this into a dedicated Docker Compose configuration for
    # tests.
    command: "postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=OFF"
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
  # A broker to run the stream tests against. Redpanda rather than Kafka: one
  # process, no ZooKeeper, and it speaks the same protocol -- which is the only
  # thing being tested here, since SQLDesk talks to it through librdkafka like
  # any other client.
  #
  # Behind a profile, so an ordinary `make up` does not start it. The stream
  # tests that need it skip themselves when it is not there; see
  # tests/streams/test_broker.py.
  broker:
    image: redpandadata/redpanda:v24.2.7
    profiles: ["streams"]
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://broker:9092
    ports:
      - "19092:9092"
    restart: unless-stopped
  email:
    image: maildev/maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    restart: unless-stopped
  # The optional interpreter, for Python cells in notebooks.
  #
  # Behind a profile, so an ordinary `make up` does not start it -- and a
  # notebook without it says so on the Python cell rather than failing when
  # somebody runs one. Start it with `docker compose --profile notebooks up`.
  #
  # Two limits that are not decoration. `internal: true` on its network is what
  # makes "no egress" true rather than stated: a cell takes its data from an
  # earlier cell, so the interpreter has nothing legitimate to reach, and here
  # it cannot reach anything at all. `mem_limit` is the per-session ceiling,
  # because an address-space rlimit small enough to be useful stops pandas and
  # DuckDB loading -- the measurements are in executor/runner.py.
  executor:
    build:
      context: .
      dockerfile: Dockerfile.executor
    profiles: ["notebooks"]
    environment:
      EXECUTOR_TOKEN: "dev-executor-token"
    mem_limit: 2g
    networks:
      - sqldesk-executor
    restart: unless-stopped

networks:
  default: {}
  # Internal: no gateway, so nothing on this network can route off the host.
  #
  # Being honest about what that does and does not buy. The executor cannot
  # reach the internet, a cloud metadata address or anything else on the
  # machine -- which is the whole of what it would want if it were trying to
  # exfiltrate a result. It *can* reach the SQLDesk server, because the server
  # has to be on this network to call it, and there is no way round that in
  # Compose. That is acceptable only because of the design decision underneath
  # all of this: the executor holds no credential, so what it can reach it
  # cannot authenticate to. In Kubernetes, use a NetworkPolicy with no egress
  # rule and the exception disappears.
  sqldesk-executor:
    internal: true
