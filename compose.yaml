# This configuration file is for the **development** setup.
x-tealdash-service: &tealdash-service
  build:
    context: .
    args:
      skip_frontend_build: "true"  # set to empty string to build
  volumes:
    - .:/app
  env_file:
    - .env
x-tealdash-environment: &tealdash-environment
  TEALDASH_HOST: http://localhost:5001
  TEALDASH_LOG_LEVEL: "INFO"
  TEALDASH_REDIS_URL: "redis://redis:6379/0"
  TEALDASH_DATABASE_URL: "postgresql://postgres@postgres/postgres"
  TEALDASH_RATELIMIT_ENABLED: "false"
  TEALDASH_MAIL_DEFAULT_SENDER: "tealdash@example.com"
  TEALDASH_MAIL_SERVER: "email"
  TEALDASH_MAIL_PORT: 1025
  TEALDASH_ENFORCE_CSRF: "true"
  TEALDASH_GUNICORN_TIMEOUT: 60
  # Set secret keys in the .env file
services:
  server:
    <<: *tealdash-service
    command: dev_server
    depends_on:
      - postgres
      - redis
    ports:
      - "5001:5000"
      - "5678:5678"
    environment:
      <<: *tealdash-environment
      PYTHONUNBUFFERED: 0
  scheduler:
    <<: *tealdash-service
    command: dev_scheduler
    depends_on:
      - server
    environment:
      <<: *tealdash-environment
  worker:
    <<: *tealdash-service
    command: dev_worker
    depends_on:
      - server
    environment:
      <<: *tealdash-environment
      PYTHONUNBUFFERED: 0
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  postgres:
    image: postgres:18-alpine
    ports:
      - "15432:5432"
    # The following turns the DB into less durable, but gains significant performance improvements for the tests run (x3
    # improvement on my personal machine). We should consider moving this into a dedicated Docker Compose configuration for
    # tests.
    command: "postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=OFF"
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
  email:
    image: maildev/maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    restart: unless-stopped
