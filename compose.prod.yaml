# Running SQLDesk from the published image.
#
# compose.yaml next to this one is the development setup: it builds from source
# and bind-mounts the working tree over /app, which would shadow anything in a
# published image. This file is the other thing -- no build, no mount, just the
# released container and the two services it needs.
#
#   cp .env.example .env     # then fill in the secrets
#   docker compose -f compose.prod.yaml run --rm server create_db
#   docker compose -f compose.prod.yaml up -d
#
# SQLDesk is then on http://localhost:5000.
#
# macOS holds port 5000 for AirPlay Receiver, so set SQLDESK_PORT (and the
# matching SQLDESK_HOST) in .env, or turn AirPlay Receiver off.

x-sqldesk-service: &sqldesk-service
  image: ${SQLDESK_IMAGE:-ghcr.io/bot-netizen/sqldesk:0.5.0}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  env_file:
    - .env
  restart: unless-stopped
  volumes:
    # Every service that touches an uploaded file needs the same one. The
    # server writes it, and the worker -- a different container -- is what
    # actually runs the query, so DuckDB opens the file by absolute path from
    # there. Without a shared volume the upload appears to succeed and every
    # query against it then fails, because the bytes only ever existed in the
    # server's container. It is also the only thing keeping uploads across a
    # `compose up` that recreates a container.
    #
    # The development compose.yaml does not need this: it bind-mounts the whole
    # working tree into every service, which is why uploads work there.
    - sqldesk-uploads:/app/uploads

x-sqldesk-environment: &sqldesk-environment
  SQLDESK_REDIS_URL: "redis://redis:6379/0"
  SQLDESK_DATABASE_URL: "postgresql://sqldesk:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres/sqldesk"
  SQLDESK_LOG_LEVEL: "INFO"
  # The address people reach SQLDesk on. Links in emails and alerts use it, so
  # it has to be right or they point at localhost.
  SQLDESK_HOST: ${SQLDESK_HOST:-http://localhost:5000}
  # The AI features, off unless asked for -- and asking for them here is only
  # half of it: `manage ai configure` still has to name a model before
  # anything calls out. Without this line the variable never reaches the
  # container, and setting it in the shell appears to do nothing.
  SQLDESK_FEATURE_AI: ${SQLDESK_FEATURE_AI:-false}
  SQLDESK_AI_TIMEOUT: ${SQLDESK_AI_TIMEOUT:-60}

services:
  server:
    <<: *sqldesk-service
    command: server
    ports:
      - "${SQLDESK_PORT:-5000}:5000"
    environment:
      <<: *sqldesk-environment
      SQLDESK_WEB_WORKERS: ${SQLDESK_WEB_WORKERS:-4}

  worker:
    <<: *sqldesk-service
    command: worker
    environment:
      <<: *sqldesk-environment
      QUEUES: "queries,scheduled_queries,schemas,periodic,emails,default"
      WORKERS_COUNT: ${SQLDESK_WORKERS_COUNT:-2}

  scheduler:
    <<: *sqldesk-service
    command: scheduler
    environment:
      <<: *sqldesk-environment

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sqldesk
      POSTGRES_DB: sqldesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Mounted at /var/lib/postgresql, not .../data. Postgres 18 keeps its
      # data in a major-version subdirectory (/var/lib/postgresql/18/docker)
      # so that pg_upgrade --link can work across a major version without the
      # old and new data directories straddling a mount point. A volume on
      # .../data is the pre-18 layout: the image sees a mount that is not
      # PGDATA, refuses to start, and restart-loops.
      - sqldesk-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqldesk -d sqldesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - sqldesk-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Pictures attached to alert emails, and nothing else.
  #
  # Commented out because it is a browser: around 400MB that most installs
  # never need. Bundling it into the SQLDesk image would put that on the
  # server and the worker both, for a feature that is off by default. Grafana
  # ships its renderer as a separate service for the same reason.
  #
  # To turn it on: uncomment this, build it with
  #   docker build -f Dockerfile.screenshots -t sqldesk-screenshots .
  # and add to the server and worker environment:
  #   SQLDESK_FEATURE_ALERT_SCREENSHOTS: "true"
  #   SQLDESK_SCREENSHOT_URL: "http://screenshots:3000"
  #   SQLDESK_INTERNAL_BASE_URL: "http://server:5000"
  #
  # screenshots:
  #   image: sqldesk-screenshots
  #   restart: unless-stopped
  #   # Chromium wants more than Docker's default 64MB of shared memory, and
  #   # runs out of it as a blank page rather than as an error.
  #   shm_size: 1gb

volumes:
  sqldesk-postgres:
  sqldesk-redis:
  sqldesk-uploads:
