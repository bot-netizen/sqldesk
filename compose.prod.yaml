# Running SQLDesk from the published image.
#
# compose.yaml next to this one is the development setup: it builds from source
# and bind-mounts the working tree over /app, which would shadow anything in a
# published image. This file is the other thing -- no build, no mount, just the
# released container and the two services it needs.
#
#   cp .env.example .env     # then fill in the secrets
#   docker compose -f compose.prod.yaml run --rm server create_db
#   docker compose -f compose.prod.yaml up -d
#
# SQLDesk is then on http://localhost:5000.
#
# That starts the core: server, worker, scheduler, Postgres, Redis. Two
# add-ons are profiles, off unless named:
#
#   --profile mcp         a worker of MCP's own (set SQLDESK_MCP_QUEUE=mcp)
#   --profile rendering   the browser that draws pictures for alert emails
#
#   docker compose -f compose.prod.yaml --profile mcp --profile rendering up -d
#
# Each needs its switch in .env as well; .env.example says which.
#
# macOS holds port 5000 for AirPlay Receiver, so set SQLDESK_PORT (and the
# matching SQLDESK_HOST) in .env, or turn AirPlay Receiver off.

x-sqldesk-service: &sqldesk-service
  image: ${SQLDESK_IMAGE:-ghcr.io/bot-netizen/sqldesk:0.6.0-rc.2}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  env_file:
    - .env
  restart: unless-stopped
  volumes:
    # Every service that touches an uploaded file needs the same one. The
    # server writes it, and the worker -- a different container -- is what
    # actually runs the query, so DuckDB opens the file by absolute path from
    # there. Without a shared volume the upload appears to succeed and every
    # query against it then fails, because the bytes only ever existed in the
    # server's container. It is also the only thing keeping uploads across a
    # `compose up` that recreates a container.
    #
    # The development compose.yaml does not need this: it bind-mounts the whole
    # working tree into every service, which is why uploads work there.
    - sqldesk-uploads:/app/uploads
    # Where `manage ai export` writes the semantic layer, and where
    # `manage ai import` reads it. A bind mount rather than a named volume
    # on purpose: the whole point of those files is that you commit them,
    # so they have to land somewhere you can run git in.
    #
    #   docker compose -f compose.prod.yaml exec server \
    #     /app/manage.py ai export /app/semantic
    #
    # and the YAML appears in ./semantic on the host, one file per table.
    # Point SQLDESK_SEMANTIC_DIR at a checkout of your model repo to write
    # straight into it. The Helm chart mounts nothing here: export to a path in
    # the pod and `kubectl cp` it out.
    - ${SQLDESK_SEMANTIC_DIR:-./semantic}:/app/semantic

x-sqldesk-environment: &sqldesk-environment
  SQLDESK_REDIS_URL: "redis://redis:6379/0"
  SQLDESK_DATABASE_URL: "postgresql://sqldesk:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres/sqldesk"
  SQLDESK_LOG_LEVEL: "INFO"
  # The address people reach SQLDesk on. Links in emails and alerts use it, so
  # it has to be right or they point at localhost.
  SQLDESK_HOST: ${SQLDESK_HOST:-http://localhost:5000}
  # MCP and the catalog behind it, off unless asked for. Without this line
  # the variable never reaches the container, and setting it in the shell
  # appears to do nothing.
  SQLDESK_FEATURE_AI: ${SQLDESK_FEATURE_AI:-false}
  # Upstream leaves CSRF checks off so as not to break old installs. There
  # are none to break here, and the application has sent the token all
  # along. API-key calls, MCP included, are not affected.
  SQLDESK_ENFORCE_CSRF: ${SQLDESK_ENFORCE_CSRF:-true}

services:
  server:
    <<: *sqldesk-service
    command: server
    ports:
      - "${SQLDESK_PORT:-5000}:5000"
    environment:
      <<: *sqldesk-environment
      SQLDESK_WEB_WORKERS: ${SQLDESK_WEB_WORKERS:-4}

  worker:
    <<: *sqldesk-service
    command: worker
    environment:
      <<: *sqldesk-environment
      # `mcp` last: taken only when everything else is empty, and never
      # stranded -- with SQLDESK_MCP_QUEUE=mcp and no mcp profile running,
      # a model's query would otherwise wait for a worker that is not there.
      QUEUES: "queries,scheduled_queries,schemas,periodic,emails,default,mcp"
      WORKERS_COUNT: ${SQLDESK_WORKERS_COUNT:-2}
    # Time to finish the query it is running before `down` or an upgrade
    # kills it. Docker's default is ten seconds.
    stop_grace_period: 5m

  # MCP's own worker, for when a model asking questions should never hold up
  # a dashboard. Only useful with SQLDESK_MCP_QUEUE=mcp in .env, which is
  # what sends MCP's queries here instead of to the data source's queue.
  mcp-worker:
    <<: *sqldesk-service
    profiles: ["mcp"]
    command: worker
    environment:
      <<: *sqldesk-environment
      QUEUES: "mcp"
      WORKERS_COUNT: ${SQLDESK_MCP_WORKERS_COUNT:-1}
    stop_grace_period: 5m

  scheduler:
    <<: *sqldesk-service
    command: scheduler
    environment:
      <<: *sqldesk-environment

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sqldesk
      POSTGRES_DB: sqldesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Mounted at /var/lib/postgresql, not .../data. Postgres 18 keeps its
      # data in a major-version subdirectory (/var/lib/postgresql/18/docker)
      # so that pg_upgrade --link can work across a major version without the
      # old and new data directories straddling a mount point. A volume on
      # .../data is the pre-18 layout: the image sees a mount that is not
      # PGDATA, refuses to start, and restart-loops.
      - sqldesk-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqldesk -d sqldesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - sqldesk-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Pictures attached to alert emails, and nothing else.
  #
  # A profile because it is a browser: several hundred megabytes that most
  # installs never need. Bundled into the SQLDesk image it would sit in the
  # server and the worker both, for a feature that is off by default; Grafana
  # ships its renderer as a separate service for the same reason.
  #
  # Start it with --profile rendering, and put the three lines from the
  # "Pictures in alert emails" part of .env.example into .env.
  screenshots:
    image: ${SQLDESK_SCREENSHOTS_IMAGE:-ghcr.io/bot-netizen/sqldesk-screenshots:0.6.0-rc.2}
    profiles: ["rendering"]
    restart: unless-stopped
    # Chromium wants more than Docker's default 64MB of shared memory, and
    # runs out of it as a blank page rather than as an error.
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/ping')"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  sqldesk-postgres:
  sqldesk-redis:
  sqldesk-uploads:
