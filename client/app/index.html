<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <base href="<%= htmlWebpackPlugin.options.baseHref %>" />
    <title><%= htmlWebpackPlugin.options.title %></title>
    <script src="<%= htmlWebpackPlugin.options.staticPath %>unsupportedRedirect.js" async></script>

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="<%= htmlWebpackPlugin.options.staticPath %>images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="<%= htmlWebpackPlugin.options.staticPath %>images/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="<%= htmlWebpackPlugin.options.staticPath %>images/favicon-16x16.png"
    />
  </head>

  <body>
    <section>
      <div id="application-root"></div>
      <div class="loading-indicator">
        <!--
          The SQLDesk mark, inline so the loading screen needs no network
          round trip to show it. This used to be a CSS recreation of the
          Redash logo, which is not our logo.
        -->
        <svg id="loading-logo" viewBox="0 0 120 120" role="img" aria-label="SQLDesk">
          <g fill="none" stroke="#0a7c93" stroke-width="4">
            <circle cx="60" cy="60" r="55.5" />
            <circle cx="60" cy="60" r="47.5" stroke-width="3.5" />
          </g>
          <g fill="#0a7c93">
            <rect x="34" y="70" width="12" height="15" rx="1.5" />
            <rect x="48" y="56" width="12" height="29" rx="1.5" />
            <rect x="62" y="63" width="12" height="22" rx="1.5" />
            <rect x="76" y="50" width="12" height="35" rx="1.5" />
            <rect x="30" y="84" width="62" height="5.5" rx="2.75" />
          </g>
          <polyline
            points="40,62 54,50 68,58 82,39"
            fill="none"
            stroke="#0a7c93"
            stroke-width="3.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <g fill="#0a7c93">
            <circle cx="40" cy="62" r="5.5" />
            <circle cx="54" cy="50" r="5.5" />
            <circle cx="68" cy="58" r="5.5" />
            <circle cx="82" cy="39" r="6.5" />
          </g>
        </svg>
        <div id="shadow"></div>
      </div>
    </section>
  </body>
</html>
