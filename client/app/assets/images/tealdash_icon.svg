<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Tealdash">
  <!--
    Tealdash mark. Vector rather than a bitmap so one file serves the 16px
    favicon and the sidebar logo alike, with no background to strip.
    Colour is the action teal from the design tokens (ac-600); change it
    here and every rendered size follows.
  -->
  <g fill="none" stroke="#0a7c93" stroke-width="4">
    <circle cx="60" cy="60" r="55.5"/>
    <circle cx="60" cy="60" r="47.5" stroke-width="3.5"/>
  </g>
  <g fill="#0a7c93">
    <!-- bars -->
    <rect x="34" y="70" width="12" height="15" rx="1.5"/>
    <rect x="48" y="56" width="12" height="29" rx="1.5"/>
    <rect x="62" y="63" width="12" height="22" rx="1.5"/>
    <rect x="76" y="50" width="12" height="35" rx="1.5"/>
    <!-- baseline -->
    <rect x="30" y="84" width="62" height="5.5" rx="2.75"/>
  </g>
  <!-- trend line over the bars -->
  <polyline points="40,62 54,50 68,58 82,39" fill="none" stroke="#0a7c93" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#0a7c93">
    <circle cx="40" cy="62" r="5.5"/>
    <circle cx="54" cy="50" r="5.5"/>
    <circle cx="68" cy="58" r="5.5"/>
    <circle cx="82" cy="39" r="6.5"/>
  </g>
</svg>
