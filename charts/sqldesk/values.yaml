# SQLDesk.
#
# Out of the box this installs everything needed to run on minikube: the
# application, a Postgres and a Redis. Both bundled databases are meant for
# development -- for anything you care about, point `postgres.external` and
# `redis.external` at a managed one and turn the bundled ones off.

image:
  repository: ghcr.io/bot-netizen/sqldesk
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# How the application is reached.
#
#   NodePort  — minikube. `minikube service sqldesk` opens it.
#   ClusterIP — behind an Ingress, which is what a real cluster wants.
service:
  type: NodePort
  port: 5000
  # Leave empty and Kubernetes picks one from its range. Pin it if you want a
  # stable URL between installs.
  nodePort: ""

ingress:
  enabled: false
  className: ""
  host: sqldesk.local
  annotations: {}
  tls: []

# The two secrets SQLDesk will not start without.
#
# Left empty they are generated on first install and then kept: the chart
# reads back what is already in the cluster rather than making new ones.
# That matters -- a new secretKey makes every stored data source credential
# undecryptable, so a chart that rotated them on `helm upgrade` would break
# an instance every time it was upgraded.
secrets:
  cookieSecret: ""
  secretKey: ""
  # Name an existing Secret instead, if it is managed elsewhere. It holds
  # cookie-secret, secret-key, database-url and postgres-password; with it
  # the bundled Redis runs without a password (see `redis`), and
  # screenshot-token is read from it if present.
  existingSecret: ""

server:
  replicas: 1
  webWorkers: 4
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 2Gi }

worker:
  replicas: 1
  # Which queues this worker takes from. Give a slow data source its own
  # queue and its own workers, so it cannot starve the rest. MCP's queue is
  # added at the end when MCP is on without a worker of its own, so it is
  # never left with nobody to take it.
  queues: "queries,scheduled_queries,schemas,periodic,emails,default"
  workersCount: 2
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 2Gi }

# The Model Context Protocol server, and the catalog it answers from.
#
# Off by default: it is an endpoint that answers questions about your
# warehouse, so turning it on is a decision somebody should make rather than
# inherit. With it off, /mcp answers 404 and the Catalog page does not appear.
streams:
  # Off, so an install that does not consume Kafka pays nothing for the fact
  # that it could. On it costs a worker deployment, and the shared volume
  # below, which is where a topic's window is written.
  #
  # Off also tells the application: the Streams permissions stop being
  # offered, the streaming halves of the Queries and Dashboards menus are not
  # drawn, and the endpoints behind them refuse. The alternative is a menu
  # that leads to pages which quietly never fill, because nothing is taking
  # from the `streams` queue.
  enabled: false
  # Kafka consumers get workers of their own, and they have to.
  #
  # A consumer is not like any other job: it holds its worker for minutes at a
  # time rather than seconds, because it runs until nobody is watching. On the
  # ordinary worker that means one stream takes a worker away from the
  # dashboards somebody is loading -- and two streams cannot consume at once,
  # because the second sits in the queue behind the first.
  #
  # So `workersCount` is the real limit on how many topics can be consumed
  # simultaneously, whatever the slot setting says. Keep it at or above
  # SQLDESK_STREAM_MAX_CONCURRENT, or the slots will not all be usable.
  worker:
    enabled: true
    replicas: 1
    # One process per topic that may be consumed at once -- and each one loads
    # the whole application, around 150 MB. Two by default, because a default
    # that matches the five slots would cost three quarters of a gigabyte on an
    # install where nobody has configured a topic yet.
    #
    # Raise it with SQLDESK_STREAM_MAX_CONCURRENT when streams are actually
    # used: the lower of the two is what limits how many topics consume at
    # once, and a slot limit of five served by two processes is a limit of two
    # wearing a five.
    workersCount: 2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

mcp:
  enabled: false
  # A queue of MCP's own, served by the worker below. Left empty, a query a
  # model asks for goes on the data source's ordinary queue -- the same one
  # dashboards use -- and competes with the people waiting for one to load.
  # Naming a queue here is what stops a model exploring from slowing down a
  # dashboard somebody is watching.
  queue: mcp
  worker:
    # Needs `queue` set as well; a worker with no queue of its own has
    # nothing to take from.
    enabled: true
    replicas: 1
    workersCount: 1
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 2Gi }
  catalog:
    # How often the catalog is rebuilt, in hours. 0 to turn the scheduled
    # harvest off and run `manage ai harvest` yourself.
    harvestHours: 24
    # How far back to look for the queries it learns from, in hours, measured
    # by when a query last *ran*. 0 for every saved query however old.
    usageWindowHours: 168
    # A file of questions the catalog has to keep answering, checked nightly
    # and scored on the Catalog page. A path inside the container, so it has
    # to be mounted -- unset, nothing is scheduled and `manage ai eval` still
    # works for CI, which is where most of its value is.
    evalFile: ""
  oauth:
    # How a person connects a client: the client opens a browser, they sign in
    # the way they always do, and it gets a token that expires and can be
    # revoked. The alternative is a personal API key living in a config file
    # outside your identity provider. On wherever MCP is on; off, the endpoints
    # answer 404 and clients fall back to a key.
    enabled: true
    # Allow the flow over plain http.
    #
    # Leave this false. An authorization code and a bearer token crossing a
    # network in the clear is exactly what the flow exists to avoid, and
    # "it is only internal" is not a property of a network anybody can check.
    # The one honest use is a local install reached through a port-forward with
    # no TLS anywhere; the server logs a warning for as long as it is on.
    allowHttp: false

# Files people upload to query -- CSV and Parquet, read by DuckDB. The server
# writes them and the worker reads them, so both mount the same volume;
# without one an upload appears to succeed and every query on it then fails.
uploads:
  # Off, so a plain install carries no volume and the workers are free to
  # schedule anywhere. Turn it on to let people upload files -- and note that
  # `streams.enabled` turns the same volume on, because a topic's window is a
  # file the stream worker writes and the server reads.
  enabled: false
  size: 5Gi
  storageClass: ""
  # ReadWriteOnce is what every cluster can provide, and it mounts on one
  # node only -- so the chart keeps the workers on the server's node. With a
  # ReadWriteMany class (EFS, Filestore, Azure Files, NFS) say so here and
  # they schedule anywhere.
  accessMode: ReadWriteOnce
  # A claim you manage instead of the one the chart makes.
  existingClaim: ""
  # What happens to a file after somebody uploads it.
  #
  # An uploaded file is the only copy there is -- unlike a query result, which
  # the warehouse can be asked for again -- so it expires on a clock people can
  # see and stop, and its uploader is emailed a day before with a button that
  # keeps it. Nothing is deleted that nobody was warned about.
  lifecycle:
    # Days before a file expires. 0 keeps everything forever, which is what
    # fills a disk.
    lifetimeDays: 7
    # Days unqueried before a file stops being registered with DuckDB. The file
    # is untouched and the next query naming it brings it back; what it stops
    # costing is schema inference on every query. 0 never unloads.
    unloadAfterDays: 3
    # A ceiling on everything uploaded, in megabytes. Keep it at or under the
    # volume size above, or the volume fills before the quota is reached and
    # the error a person sees is a disk error rather than a sentence they can
    # act on. 0 removes the ceiling.
    quotaMb: 5120

# The browser that draws pictures for alert emails, and nothing else. Off by
# default: it is several hundred megabytes of Chromium for one feature, and
# the SQLDesk image stays the same size either way. On, it also turns on the
# feature and tells the worker where the renderer is.
rendering:
  enabled: false
  image:
    repository: ghcr.io/bot-netizen/sqldesk-screenshots
    # Defaults to the chart's appVersion.
    tag: ""
  # What the worker shows the renderer, so nothing else in the cluster can
  # ask it to fetch a page. Generated and kept when left empty.
  token: ""
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 2Gi }

# Exactly one. Two schedulers would double-schedule everything, so this is
# not a number to raise.
scheduler:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 512Mi }

postgres:
  # false when you point `external` at a managed database
  enabled: true
  image: postgres:18-alpine
  database: sqldesk
  user: sqldesk
  password: ""          # generated and kept, like the secrets above
  storage: 8Gi
  storageClass: ""
  # postgresql://user:password@host:5432/database
  external: ""

redis:
  enabled: true
  image: redis:7-alpine
  # Queues, locks and a schema cache. Nothing here needs to survive a
  # restart, which is why there is no volume.
  #
  # A worker takes whatever a queue holds, so anything that can reach Redis
  # can run code on the worker. The bundled Redis therefore takes a
  # password -- generated and kept, like the secrets above -- whenever the
  # chart manages the Secret, and the network policy below keeps everything
  # but this release's pods away from it.
  password: ""
  external: ""

# Only this release's pods may talk to its Postgres, Redis and renderer.
# Needs a network plugin that enforces NetworkPolicy (Calico, Cilium, the
# managed clouds' own); where none does, the policy is accepted and ignored.
networkPolicy:
  enabled: true

# Runs `manage db upgrade` before the new version takes traffic, as a Helm
# hook. Also creates the tables on a first install.
migrations:
  enabled: true

# The address that appears in emails and alert links. Wrong, and every link
# points at localhost.
host: ""

extraEnv: {}
nodeSelector: {}
tolerations: []
affinity: {}
