{{- if .Values.rendering.enabled }}
# The renderer: a browser that turns a page into a PNG for an alert email.
#
# Its own Deployment and its own image, so the SQLDesk image carries no
# browser. It holds no credentials and keeps no state; the worker hands it a
# URL and a key scoped to one query, and it sends that key to SQLDesk only.
# It renders only SQLDesk's own address, and only for a caller that shows
# the token the chart generated: a browser that fetched any page for anyone
# on the cluster network would be a way to reach what that network can.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sqldesk.fullname" . }}-screenshots
  labels:
    {{- include "sqldesk.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    {{- include "sqldesk.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: screenshots
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sqldesk.fullname" . }}-screenshots
  labels:
    {{- include "sqldesk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.rendering.replicas }}
  selector:
    matchLabels:
      {{- include "sqldesk.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: screenshots
  template:
    metadata:
      labels:
        {{- include "sqldesk.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: screenshots
    spec:
      securityContext:
        # The image's own user; a browser that renders pages is the last thing
        # that should be root.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: screenshots
          image: {{ printf "%s:%s" .Values.rendering.image.repository (.Values.rendering.image.tag | default .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # The same address the worker builds its URLs from, from one
            # helper: the renderer refuses anything that is not the SQLDesk it
            # serves, so these two drifting apart turns every screenshot into
            # a 400 nobody sees.
            - name: SCREENSHOT_ALLOWED_ORIGIN
              value: {{ include "sqldesk.internalBaseUrl" . | quote }}
            - name: SCREENSHOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "sqldesk.secretName" . }}
                  key: screenshot-token
                  optional: true
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.rendering.resources | nindent 12 }}
          volumeMounts:
            # Chromium keeps its shared memory here, and the container
            # default of 64MB runs out as a blank page rather than an error.
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
