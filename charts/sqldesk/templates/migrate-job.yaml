{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sqldesk.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "sqldesk.labels" . | nindent 4 }}
  annotations:
    # Before the new version takes traffic. `post-install` creates the
    # tables; `pre-upgrade` runs the migrations while the old pods are still
    # the ones serving, which is the order that does not show anyone a
    # half-migrated schema.
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "sqldesk.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "sqldesk.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # `create_tables` is idempotent and stamps the schema at head, so
          # the first install needs no migrations and every later one runs
          # only what is missing.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              ./manage.py database create_tables
              ./manage.py db upgrade
          env:
            {{- include "sqldesk.env" . | nindent 12 }}
{{- end }}
