{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sqldesk.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "sqldesk.labels" . | nindent 4 }}
  annotations:
    # Before the new version takes traffic. `post-install` creates the
    # tables; `pre-upgrade` runs the migrations while the old pods are still
    # the ones serving, which is the order that does not show anyone a
    # half-migrated schema.
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # Room for a first install, where the database and the image may both
  # still be arriving. Install with `--timeout 15m` to give Helm as long.
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "sqldesk.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- include "sqldesk.podSecurity" . | nindent 6 }}
      initContainers:
        # Wait for Postgres rather than failing at it.
        #
        # On a first install the database and this Job are created together,
        # and Postgres takes a few seconds longer than the image does. Without
        # this the Job's first attempt fails on connect, and Helm's hook then
        # waits out the backoff between retries -- an install that works, but
        # looks broken for a minute with `Error` in `kubectl get pods` and
        # nothing saying why.
        - name: wait-for-postgres
          image: {{ include "sqldesk.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "sqldesk.containerSecurity" . | nindent 10 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=0
              until python -c "
              import os, sys
              import psycopg2
              try:
                  psycopg2.connect(os.environ['SQLDESK_DATABASE_URL']).close()
              except Exception as e:
                  sys.exit(str(e).strip())
              "; do
                i=$((i + 1))
                if [ "$i" -ge 60 ]; then
                  echo "Postgres did not answer within two minutes. Giving up so the failure is visible."
                  exit 1
                fi
                echo "Waiting for Postgres ($i)..."
                sleep 2
              done
              echo "Postgres is up."
          env:
            {{- include "sqldesk.env" . | nindent 12 }}
      containers:
        - name: migrate
          image: {{ include "sqldesk.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "sqldesk.containerSecurity" . | nindent 10 }}
          # `create_tables` is idempotent and stamps the schema at head, so
          # the first install needs no migrations and every later one runs
          # only what is missing.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              ./manage.py database create_tables
              ./manage.py db upgrade
          env:
            {{- include "sqldesk.env" . | nindent 12 }}
{{- end }}
