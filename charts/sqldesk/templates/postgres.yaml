{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sqldesk.fullname" . }}-postgres
  labels:
    {{- include "sqldesk.labels" . | nindent 4 }}
  annotations:
    # The application's own database: users, queries, dashboards, results.
    # Deleting the release should not delete them.
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.postgres.storageClass }}
  storageClassName: {{ .Values.postgres.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sqldesk.fullname" . }}-postgres
  labels:
    {{- include "sqldesk.labels" . | nindent 4 }}
spec:
  ports:
    - port: 5432
      targetPort: postgres
  selector:
    {{- include "sqldesk.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sqldesk.fullname" . }}-postgres
  labels:
    {{- include "sqldesk.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    # Two Postgres processes must not hold the same volume, and the default
    # rolling update would start the new one before stopping the old.
    type: Recreate
  selector:
    matchLabels:
      {{- include "sqldesk.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "sqldesk.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sqldesk.secretName" . }}
                  key: postgres-password
            # The image initialises into this directory; a mount at
            # /var/lib/postgresql/data itself trips over lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "sqldesk.fullname" . }}-postgres
{{- end }}
