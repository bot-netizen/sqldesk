apiVersion: v1
kind: Service
metadata:
  name: {{ include "sqldesk.fullname" . }}
  labels:
    {{- include "sqldesk.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "sqldesk.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sqldesk.fullname" . }}-server
  labels:
    {{- include "sqldesk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "sqldesk.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      annotations:
        # Changes when the secrets do, so the pods roll. See
        # `sqldesk.secretChecksum` for why this is not simply a checksum of
        # the rendered template.
        checksum/secret: {{ include "sqldesk.secretChecksum" . }}
      labels:
        {{- include "sqldesk.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- include "sqldesk.podSecurity" . | nindent 6 }}
      containers:
        - name: server
          image: {{ include "sqldesk.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "sqldesk.containerSecurity" . | nindent 10 }}
          args: ["server"]
          ports:
            - name: http
              containerPort: 5000
          env:
            {{- include "sqldesk.env" . | nindent 12 }}
            - name: SQLDESK_WEB_WORKERS
              value: {{ .Values.server.webWorkers | quote }}
          readinessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            # Kubernetes' default is one second, which is not long enough for
            # a Python process that is merely busy. On a small node a garbage
            # collection or a burst of traffic takes `/ping` past a second,
            # and the pod is then marked unready -- taken out of the Service
            # while it is working perfectly well.
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /ping, port: http }
            # Generous: a server busy serving is not a server to restart.
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
            # Same reasoning, and more so: this one restarts the container.
            # Seen on the development cluster -- the node ran short of memory,
            # `/ping` went past a second, and a server that would have
            # recovered was killed and restarted instead.
            timeoutSeconds: 10
          volumeMounts:
            {{- include "sqldesk.uploadsMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      volumes:
        {{- include "sqldesk.uploadsVolume" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /*
        The same affinity the workers get, which names the server -- so the
        server's replicas, and each pod a rolling update adds, land on the node
        that already holds a ReadWriteOnce uploads volume. Without it a second
        replica could schedule elsewhere and never attach; worse, an update
        with one replica could deadlock, the new pod unable to mount the volume
        until the old one let go, and the old one kept until the new was ready.
        The first server pod still schedules anywhere: a pod matching its own
        affinity term is allowed when nothing else matches yet.
      */}}
      {{- include "sqldesk.uploadsAffinity" . | nindent 6 }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sqldesk.fullname" . }}
  labels:
    {{- include "sqldesk.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "sqldesk.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
