apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sqldesk.fullname" . }}-worker
  labels:
    {{- include "sqldesk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "sqldesk.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        # Changes when the secrets do, so the pods roll. See
        # `sqldesk.secretChecksum` for why this is not simply a checksum of
        # the rendered template.
        checksum/secret: {{ include "sqldesk.secretChecksum" . }}
      labels:
        {{- include "sqldesk.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- include "sqldesk.podSecurity" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "sqldesk.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "sqldesk.containerSecurity" . | nindent 10 }}
          args: ["worker"]
          env:
            {{- include "sqldesk.env" . | nindent 12 }}
            - name: QUEUES
              {{- /*
                MCP's queue goes last on the ordinary worker when nothing
                else takes it. Named with no worker of its own, it would
                otherwise hold every model query forever. The same for
                streams: switched on with their worker off, consumer jobs
                waited for a worker that was not there and the Streams pages
                never filled.
              */}}
              {{- $queues := .Values.worker.queues }}
              {{- /*
                And the housekeeping queues, when nothing else takes them.
                Switched off, they must not be stranded: no scheduling, no
                alerts and no mail is a worse failure than a slow query,
                because nothing reports it.
              */}}
              {{- if not .Values.periodicWorker.enabled }}
              {{- $queues = printf "%s,%s" $queues .Values.periodicWorker.queues }}
              {{- end }}
              {{- if and .Values.mcp.enabled .Values.mcp.queue (not .Values.mcp.worker.enabled) }}
              {{- $queues = printf "%s,%s" $queues .Values.mcp.queue }}
              {{- end }}
              {{- if and .Values.streams.enabled (not .Values.streams.worker.enabled) }}
              {{- $queues = printf "%s,streams" $queues }}
              {{- end }}
              value: {{ $queues | quote }}
            - name: WORKERS_COUNT
              value: {{ .Values.worker.workersCount | quote }}
          livenessProbe:
            # Asks this container's supervisord whether its own workers are
            # running. Not the count of workers registered in Redis, which is
            # every pod's workers against one pod's expectation -- see the
            # comment on `workers_healthcheck`.
            exec:
              command: ["/app/bin/docker-entrypoint", "workers_healthcheck"]
            # worker.conf sets startsecs=300, so a fresh worker reports
            # STARTING for five minutes; the check counts that as alive, and
            # this only has to outlast the image pull and the imports.
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            # A worker briefly restarting is supervisord doing its job. Three
            # failures in a row is supervisord having given up.
            failureThreshold: 3
          volumeMounts:
            {{- include "sqldesk.uploadsMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        {{- include "sqldesk.uploadsVolume" . | nindent 8 }}
      # A worker in the middle of somebody's four-minute query should be
      # allowed to finish it.
      terminationGracePeriodSeconds: 300
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "sqldesk.uploadsAffinity" . | nindent 6 }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.periodicWorker.enabled }}
---
# Scheduling, alerts, mail and the cleanups: everything that is not a query.
#
# The point is what it does *not* do: run queries. A query can hold a worker
# for minutes, and with the housekeeping queues on the same worker, two slow
# queries meant nothing was deciding what to refresh, nothing was evaluating
# alerts and nothing was sending mail. The install went on answering every
# probe while quietly stopping being an install.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sqldesk.fullname" . }}-periodic-worker
  labels:
    {{- include "sqldesk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.periodicWorker.replicas }}
  selector:
    matchLabels:
      {{- include "sqldesk.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: periodic-worker
  template:
    metadata:
      annotations:
        checksum/secret: {{ include "sqldesk.secretChecksum" . }}
      labels:
        {{- include "sqldesk.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: periodic-worker
    spec:
      {{- include "sqldesk.podSecurity" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "sqldesk.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "sqldesk.containerSecurity" . | nindent 10 }}
          args: ["worker"]
          env:
            {{- include "sqldesk.env" . | nindent 12 }}
            - name: QUEUES
              value: {{ .Values.periodicWorker.queues | quote }}
            - name: WORKERS_COUNT
              value: {{ .Values.periodicWorker.workersCount | quote }}
          livenessProbe:
            exec:
              command: ["/app/bin/docker-entrypoint", "workers_healthcheck"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            {{- include "sqldesk.uploadsMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.periodicWorker.resources | nindent 12 }}
      volumes:
        {{- include "sqldesk.uploadsVolume" . | nindent 8 }}
      # None of this work is long: a job here is seconds, not minutes.
      terminationGracePeriodSeconds: 60
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "sqldesk.uploadsAffinity" . | nindent 6 }}
{{- end }}
{{- if and .Values.mcp.enabled .Values.mcp.queue .Values.mcp.worker.enabled }}
---
# A worker that takes only MCP's queue.
#
# The point is what it does *not* take: with MCP queries on the ordinary
# queue, a model working through a warehouse competes for workers with the
# people waiting for a dashboard, and the dashboard loses because there are
# more model queries than people. Giving MCP its own queue only helps if
# something is listening to it, which is this.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sqldesk.fullname" . }}-mcp-worker
  labels:
    {{- include "sqldesk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mcp.worker.replicas }}
  selector:
    matchLabels:
      {{- include "sqldesk.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-worker
  template:
    metadata:
      annotations:
        # Changes when the secrets do, so the pods roll. See
        # `sqldesk.secretChecksum` for why this is not simply a checksum of
        # the rendered template.
        checksum/secret: {{ include "sqldesk.secretChecksum" . }}
      labels:
        {{- include "sqldesk.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-worker
    spec:
      {{- include "sqldesk.podSecurity" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "sqldesk.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "sqldesk.containerSecurity" . | nindent 10 }}
          args: ["worker"]
          env:
            {{- include "sqldesk.env" . | nindent 12 }}
            - name: QUEUES
              value: {{ .Values.mcp.queue | quote }}
            - name: WORKERS_COUNT
              value: {{ .Values.mcp.worker.workersCount | quote }}
          livenessProbe:
            # Asks this container's supervisord whether its own workers are
            # running. Not the count of workers registered in Redis, which is
            # every pod's workers against one pod's expectation -- see the
            # comment on `workers_healthcheck`.
            exec:
              command: ["/app/bin/docker-entrypoint", "workers_healthcheck"]
            # worker.conf sets startsecs=300, so a fresh worker reports
            # STARTING for five minutes; the check counts that as alive, and
            # this only has to outlast the image pull and the imports.
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            # A worker briefly restarting is supervisord doing its job. Three
            # failures in a row is supervisord having given up.
            failureThreshold: 3
          volumeMounts:
            {{- include "sqldesk.uploadsMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.mcp.worker.resources | nindent 12 }}
      volumes:
        {{- include "sqldesk.uploadsVolume" . | nindent 8 }}
      # Same reasoning as the ordinary worker: a query somebody -- or
      # something -- is waiting on should be allowed to finish.
      terminationGracePeriodSeconds: 300
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "sqldesk.uploadsAffinity" . | nindent 6 }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if and .Values.streams.enabled .Values.streams.worker.enabled }}
---
# Kafka consumers, on workers of their own.
#
# A consumer holds its worker for minutes rather than seconds, because it runs
# until nobody is watching. Sharing the ordinary worker means one stream takes
# a worker away from the dashboards somebody is loading, and two streams cannot
# consume at once because the second waits behind the first. `workersCount`
# here is the real limit on how many topics consume simultaneously, whatever
# the slot setting says.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sqldesk.fullname" . }}-stream-worker
  labels:
    {{- include "sqldesk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.streams.worker.replicas }}
  selector:
    matchLabels:
      {{- include "sqldesk.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: stream-worker
  template:
    metadata:
      annotations:
        checksum/secret: {{ include "sqldesk.secretChecksum" . }}
      labels:
        {{- include "sqldesk.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: stream-worker
    spec:
      {{- include "sqldesk.podSecurity" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "sqldesk.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "sqldesk.containerSecurity" . | nindent 10 }}
          args: ["worker"]
          env:
            {{- include "sqldesk.env" . | nindent 12 }}
            - name: QUEUES
              value: "streams"
            - name: WORKERS_COUNT
              value: {{ .Values.streams.worker.workersCount | quote }}
          livenessProbe:
            exec:
              command: ["/app/bin/docker-entrypoint", "workers_healthcheck"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            {{- include "sqldesk.uploadsMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.streams.worker.resources | nindent 12 }}
      volumes:
        {{- include "sqldesk.uploadsVolume" . | nindent 8 }}
      # A consumer that is told to stop finishes its flush rather than losing
      # the events it has already polled.
      terminationGracePeriodSeconds: 120
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* It mounts the uploads volume -- a topic's window is a file on it -- so
             it has to share the server's node like every other pod that does. */}}
      {{- include "sqldesk.uploadsAffinity" . | nindent 6 }}
{{- end }}
{{- if .Values.scheduler.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sqldesk.fullname" . }}-scheduler
  labels:
    {{- include "sqldesk.labels" . | nindent 4 }}
spec:
  # Safe above one: rq-scheduler enqueues only while holding a Redis lock, so
  # the others skip the pass. See the comment on `scheduler.replicas`.
  replicas: {{ .Values.scheduler.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sqldesk.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      annotations:
        # Changes when the secrets do, so the pods roll. See
        # `sqldesk.secretChecksum` for why this is not simply a checksum of
        # the rendered template.
        checksum/secret: {{ include "sqldesk.secretChecksum" . }}
      labels:
        {{- include "sqldesk.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
    spec:
      {{- include "sqldesk.podSecurity" . | nindent 6 }}
      containers:
        - name: scheduler
          image: {{ include "sqldesk.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "sqldesk.containerSecurity" . | nindent 10 }}
          args: ["scheduler"]
          env:
            {{- include "sqldesk.env" . | nindent 12 }}
          livenessProbe:
            # A scheduler whose process is up and whose loop has stopped is
            # the failure nothing else reports: no scheduled query runs and
            # Kubernetes sees a healthy container. The scheduler writes a
            # heartbeat every pass; this reads it.
            exec:
              command: ["/app/bin/docker-entrypoint", "scheduler_healthcheck"]
            # The heartbeat lasts 90 seconds, so the first one has to have
            # been written before this starts asking.
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
{{- end }}
