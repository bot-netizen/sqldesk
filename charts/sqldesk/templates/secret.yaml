{{- if not .Values.secrets.existingSecret }}
{{- /*
  Generated once, here, and used for both the password Postgres is given and
  the URL the application is given. Two calls to the generator produce two
  different passwords, which is a first install that cannot connect.
*/ -}}
{{- $password := include "sqldesk.keepSecret" (dict "ctx" . "key" "postgres-password" "value" .Values.postgres.password) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sqldesk.fullname" . }}-secrets
  labels:
    {{- include "sqldesk.labels" . | nindent 4 }}
  annotations:
    # Kept across upgrades rather than regenerated. A new secret-key makes
    # every stored data source credential undecryptable.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  cookie-secret: {{ include "sqldesk.keepSecret" (dict "ctx" . "key" "cookie-secret" "value" .Values.secrets.cookieSecret) | quote }}
  secret-key: {{ include "sqldesk.keepSecret" (dict "ctx" . "key" "secret-key" "value" .Values.secrets.secretKey) | quote }}
  postgres-password: {{ $password | quote }}
  database-url: {{ include "sqldesk.databaseUrl" (dict "ctx" . "password" $password) | quote }}
  {{- if .Values.ai.apiKey }}
  ai-api-key: {{ .Values.ai.apiKey | quote }}
  {{- end }}
{{- end }}
