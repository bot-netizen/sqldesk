<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social card source</title>
<!-- The 1200x630 image link previews show. Regenerate after a branding change:
     python3 -m http.server 4173 --directory docs
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
       --window-size=1200,630 --force-device-scale-factor=1 --virtual-time-budget=4000 \
       --screenshot=docs/assets/social-card.png http://localhost:4173/tools/social-card.html -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root{
    --canvas:#f6f8f9; --surface:#fff; --rule:#e8e5e1; --ink:#1c1b1a; --muted:#6f6b66;
    --accent:#0a7c93; --accent-ink:#086476; --accent-wash:#e4f4f7;
    --sans:"Instrument Sans",system-ui,sans-serif; --mono:"JetBrains Mono",monospace;
  }
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:var(--canvas);font-family:var(--sans);color:var(--ink);
       display:grid;grid-template-columns:1fr 468px;align-items:center;gap:40px;padding:54px 0 54px 64px}
  .brand{display:flex;align-items:center;gap:13px;margin-bottom:30px}
  .brand svg{width:44px;height:44px;color:var(--accent)}
  .brand span{font-size:30px;font-weight:700;letter-spacing:-.02em}
  h1{font-size:52px;line-height:1.08;letter-spacing:-.025em;max-width:16ch}
  p{margin-top:20px;font-size:21px;line-height:1.45;color:var(--muted);max-width:30ch}
  .chips{display:flex;gap:9px;margin-top:30px;flex-wrap:wrap}
  .chip{font:500 15px/1 var(--mono);color:var(--accent-ink);background:var(--accent-wash);
        border:1px solid #c6e8ee;border-radius:7px;padding:9px 12px}
  .shot{width:468px;height:522px;overflow:hidden;border-left:1px solid var(--rule);
        display:flex;align-items:center;justify-content:center;background:var(--surface)}
  .shot img{width:980px;max-width:none;border-radius:10px;box-shadow:0 18px 50px rgba(28,27,26,.18)}
</style>
</head>
<body>
  <div>
    <div class="brand">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <g fill="none" stroke="currentColor"><circle cx="60" cy="60" r="55.5" stroke-width="4"/></g>
        <g fill="currentColor">
          <rect x="34" y="70" width="12" height="15" rx="1.5"/><rect x="48" y="56" width="12" height="29" rx="1.5"/>
          <rect x="62" y="63" width="12" height="22" rx="1.5"/><rect x="76" y="50" width="12" height="35" rx="1.5"/>
          <rect x="30" y="84" width="62" height="5.5" rx="2.75"/>
        </g>
      </svg>
      <span>SQLDesk</span>
    </div>
    <h1>One place for everything you do with data.</h1>
    <p>Query 35+ databases, chart it, and let your agent ask the same questions you can.</p>
    <div class="chips">
      <span class="chip">Self-hosted</span>
      <span class="chip">Apache 2.0</span>
      <span class="chip">MCP</span>
      <span class="chip">Kafka streams</span>
    </div>
  </div>
  <div class="shot"><img src="../assets/live-dashboard.jpg" alt=""></div>
</body>
</html>
